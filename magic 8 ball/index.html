<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Dancing+Script|Montserrat:400,700&display=swap&subset=latin-ext"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Magic 8 ball</title>
</head>

<body>
    <div class="wrapper">
        <div class="info">
            <h1>Magic 8 Ball</h1>
            <p>Zadaj pytanie, kliknij bilę i poznaj prawdę!</p>
        </div>
        <div class="ball-img">
            <img src="./img/ball-35516_1920.png" alt="Billa czarna numer 8">
        </div>
        <div class="question-area">
            <h2>Zadaj pytanie:</h2>
            <input type="text">
            <p class="answear"></p>
            <p class="error"></p>
        </div>
    </div>


    <script src="./main.js"></script>
</body>

</html>
