<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prosty stoper z historią pomiarów i zmianą motywu kolorystycznego">
    <link href="https://fonts.googleapis.com/css?family=Dancing+Script|Montserrat:400,700&display=swap&subset=latin-ext"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/2a1015e329.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./style.css">
    <title>Stoper</title>
</head>

<body>
    <div class="wrapper">
        <div class="info-buttons">
            <button class="info-brush">
                <i class="fa-solid fa-paintbrush"></i>
            </button>
            <button class="info-question"><i class="fas fa-question"></i></button>
        </div>
        <div class="color-selector">
            <div class="color-ring one"></div>
            <div class="color-ring two"></div>
            <div class="color-ring three"></div>
            <div class="color-settings">
                <label for="color">
                    <p><i class="fa-solid fa-gear"></i></p>
                </label>
                <input type="color" id="color">
            </div>

        </div>
        <h1>Stoper</h1>
        <p class="stopwatch">00:00</p>
        <p class="time">00:00</p>

        <div class="buttons">
            <button class="stoper-btn start"><i class="fas fa-play"></i></button>
            <button class="stoper-btn pause"><i class="fas fa-pause"></i></button>
            <button class="stoper-btn stop"><i class="fas fa-stop"></i></button>
            <button class="stoper-btn reset"><i class="fas fa-times"></i></button>
            <button class="stoper-btn history">Archiwum</button>
        </div>
        <ul class="time-list">
        </ul>
    </div>
    <div class="modal-shadow hide-modal">
        <div class="modal">
            <h3>Instrukcja:</h3>
            <p><i class="fas fa-play"></i> - start</p>
            <p><i class="fas fa-pause"></i> - pauza</p>
            <p><i class="fas fa-stop"></i> - stop</p>
            <p><i class="fas fa-times"></i> - skasuj wszystko (łącznie z archiwum)</p>
            <p><span>archiwum</span> - zobacz wcześniejsze pomiary</p>

            <button class="stoper-btn close">Zamknij</button>
        </div>
    </div>


    <script src="./main.js"></script>
</body>

</html>
