<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/2a1015e329.js" crossorigin="anonymous"></script>
    <script src="./main.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main class="todo-app ">
        <header class="todo-app__header">
            <h1 class="todo-app__header-title">ToDo List</h1>
            <div class="todo-app__header-input-box">
                <input type="text" class="todo-app__header-input" placeholder="Wpisz treść zadania...">
                <button class="todo-app__header-btn">Dodaj</button>
            </div>
        </header>
        <section class="todo-app__filters">
            <button class="todo-app__filters-btn" data-filter="all">Wszystkie</button>
            <button class="todo-app__filters-btn" data-filter="active">Aktywne</button>
            <button class="todo-app__filters-btn" data-filter="completed">Wykonane</button>
        </section>
        <section class="todo-app__list">
            <h3 class="todo-app__list-title">Lista zadań:</h3>
            <p class="todo-app__list-error-info">Brak zadań na liście.</p>
            <ul class="todo-app__list-list"></ul>
        </section>
    </main>


    <div class="popup-shadow"></div>
    <div class="popup">
        <h3 class="popup-title">Edytuj zadanie:</h3>
        <div class="popup__body">
            <p class="popup__body-info"></p>
            <input type="text" class="popup__body-input" placeholder="Wprowadź nową treść zadania...">
            <button class="popup__body-btn popup__body-btn--accept">Zatwierdź</button>
            <button class="popup__body-btn popup__body-btn--cancel">Anuluj</button>
        </div>
    </div>


</body>

</html>
